- name: Installer Docker et le plugin Compose (dépôts Ubuntu)
  ansible.builtin.apt:
    name: [docker.io, docker-compose-v2]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Démarrer Docker au boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Autoriser les utilisateurs à utiliser Docker sans sudo
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
